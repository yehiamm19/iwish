application.title=I-Wish
application.vendor=I-Wish Team
build.classes.dir=${build.dir}/classes
build.classes.excludes=**/*.java,**/*.form
build.dir=build
build.generated.sources.dir=${build.dir}/generated-sources
build.test.classes.dir=${build.dir}/test/classes
build.test.results.dir=${build.dir}/test/results
debug.modulepath=\
    ${run.modulepath}
debug.test.modulepath=\
    ${run.test.modulepath}
dist.dir=dist
dist.jar=${dist.dir}/IWish.jar
dist.javadoc.dir=${dist.dir}/javadoc
excludes=
includes=**
file.reference.mysql-connector-j-9.0.0.jar=lib/mysql-connector-j-9.0.0.jar
file.reference.protobuf-java-4.26.1.jar=lib/protobuf-java-4.26.1.jar
file.reference.javafx-base-win.jar=lib/javafx-base-21.0.5-win.jar
file.reference.javafx-controls-win.jar=lib/javafx-controls-21.0.5-win.jar
file.reference.javafx-graphics-win.jar=lib/javafx-graphics-21.0.5-win.jar
javac.classpath=\
    ${file.reference.mysql-connector-j-9.0.0.jar}:\
    ${file.reference.protobuf-java-4.26.1.jar}:\
    ${file.reference.javafx-base-win.jar}:\
    ${file.reference.javafx-controls-win.jar}:\
    ${file.reference.javafx-graphics-win.jar}
javac.modulepath=
javac.processormodulepath=
javac.test.classpath=\
    ${javac.classpath}
javac.test.modulepath=\
    ${javac.modulepath}
main.class=iwish.client.Main
run.classpath=\
    ${javac.classpath}:\
    ${build.classes.dir}
run.modulepath=\
    ${javac.modulepath}
run.test.classpath=\
    ${javac.test.classpath}:\
    ${build.test.classes.dir}
run.test.modulepath=\
    ${javac.test.modulepath}
src.dir=src
javac.source=21
javac.target=21
javac.debug=true
javac.deprecation=false
run.jvmargs=--enable-native-access=ALL-UNNAMED -Dfile.encoding=UTF-8

